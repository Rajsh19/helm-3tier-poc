{{- if .Values.enabled }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      serviceAccountName: backend-sa
      
      containers:
      - name: backend

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        command:
        - sh
        - -c
        - "while true; do echo Backend Running; sleep 30; done"

        env:
        - name: DB_HOST
          value: postgres-service

        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: dbname

        ports:
        - containerPort: 3000

{{- end }}