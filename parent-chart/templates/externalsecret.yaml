apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
  name: postgres-secret

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore

  target:
    name: postgres-secret

  data:
    - secretKey: username
      remoteRef:
        key: postgres-username

    - secretKey: password
      remoteRef:
        key: postgres-password

    - secretKey: dbname
      remoteRef:
        key: postgres-dbname